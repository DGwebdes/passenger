name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm and node
        uses: pnpm/setup@v1
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          cache-dependency-path: app/client/pnpm-lock.yaml
          package-json-file: app/client/package.json

      - name: Install dependencies
        working-directory: app/client
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: app/client
        run: pnpm lint

      - name: Build
        working-directory: app/client
        run: pnpm build
  
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set username/repo lowercase
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app/client
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC}}:latest
            ghcr.io/${{ env.REPO_LC}}:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set user/repo to lowercase again (different job env)
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: tier1-app
          region: europe-west1
          image: ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}


